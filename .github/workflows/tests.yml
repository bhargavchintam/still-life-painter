name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install panda3d pytest -r requirements.txt
      # There are no unit tests yet. pytest exits with code 5 when it finds
      # no tests, so allow that; any tests added later will run here.
      - name: Run the unit tests
        run: python -m pytest || [ $? -eq 5 ]
      # The game needs the Poly Haven models and textures, which are not in
      # the repo, so CI cannot open the studio. It only checks that the game
      # module and the glTF loader import cleanly.
      - name: Check that the game and its dependencies import
        run: python -c "import gltf, still_life_painter"
